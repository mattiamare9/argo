executeActionsBody=Hello,\n\nto sign in to your company applications, register a passkey: you will use your fingerprint, face or device PIN, with no password.\n\nOpen this link on the device you normally use:\n{0}\n\nThe link expires within {4}. If you were not expecting this email, ignore it and tell whoever manages access at your company.
executeActionsBodyHtml=<p>Hello,</p><p>to sign in to your company applications, register a <strong>passkey</strong>: you will use your fingerprint, face or device PIN, with no password.</p><p><a href="{0}">Register your passkey</a></p><p>Open the link on the device you normally use. It expires within {4}.</p><p>If you were not expecting this email, ignore it and tell whoever manages access at your company.</p>
