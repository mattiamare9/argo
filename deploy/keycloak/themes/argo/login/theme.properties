# Tema di login di Argo: estende il tema ufficiale e cambia solo colori, font e fondo
# (token di frontend/DESIGN.md). Struttura e accessibilità restano quelle di Keycloak.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/argo.css
# Solo tema chiaro: col tema scuro di keycloak.v2 il riquadro diventa nero e i colori di
# argo.css (testo scuro) restano, quindi testo nero su nero.
darkMode=false
