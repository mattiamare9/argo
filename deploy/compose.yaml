# Profili: db (PostgreSQL), app (+ api), idp (PostgreSQL + Keycloak + Mailpit). In arrivo: test, prod.
name: argo

services:
  postgres:
    image: postgres:17.7-alpine
    profiles: [db, app, idp]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # solo localhost, mai pubblico
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Identity provider. Sviluppo: start-dev su HTTP, realm importato da deploy/keycloak/.
  # In sviluppo usa l'istanza postgres condivisa (ADR-018); in produzione avrà keycloak-db.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [idp]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-argo}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?imposta KC_ADMIN_PASSWORD in deploy/.env}
      ARGO_BACKEND_CLIENT_SECRET: ${ARGO_BACKEND_CLIENT_SECRET:?imposta ARGO_BACKEND_CLIENT_SECRET}
      ARGO_DASHBOARD_CLIENT_SECRET: ${ARGO_DASHBOARD_CLIENT_SECRET:?imposta ARGO_DASHBOARD_CLIENT_SECRET}
      # Sostituiti nel realm all'import (deploy/keycloak/argo-realm.json).
      ARGO_PUBLIC_URL: http://localhost:5173
      ARGO_SMTP_HOST: mailpit
      ARGO_SMTP_PORT: "1025"
      ARGO_SMTP_FROM: argo@localhost
      ARGO_SMTP_AUTH: "false"
      ARGO_SMTP_USER: ""
      ARGO_SMTP_PASSWORD: ""
      ARGO_SMTP_STARTTLS: "false"
      ARGO_SMTP_AUTH_TYPE: basic
      ARGO_SMTP_TOKEN_URL: ""
      ARGO_SMTP_TOKEN_SCOPE: ""
      ARGO_SMTP_TOKEN_CLIENT_ID: ""
      ARGO_SMTP_TOKEN_CLIENT_SECRET: ""
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -Xms128m -Xmx512m"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/argo-realm.json:/opt/keycloak/data/import/argo-realm.json:ro
      - ./keycloak/themes/argo:/opt/keycloak/themes/argo:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'immagine non ha curl: richiesta HTTP minima sulla porta di management.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Cattura le email in sviluppo (non le invia): UI su http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [idp]
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Backend in container. In sviluppo di solito si usa uvicorn sul host (DEVELOPMENT.md).
  api:
    build: ../backend
    profiles: [app]
    environment:
      ARGO_ENVIRONMENT: ${ARGO_ENVIRONMENT:-development}
      ARGO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argo}:${POSTGRES_PASSWORD}@postgres:5432/iam_db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Esegue i job (provisioning). Stessa immagine dell'API, comando diverso (ADR-006).
  worker:
    build: ../backend
    profiles: [app]
    command: ["python", "-m", "app.worker"]
    environment:
      ARGO_ENVIRONMENT: ${ARGO_ENVIRONMENT:-development}
      ARGO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-argo}:${POSTGRES_PASSWORD}@postgres:5432/iam_db
      ARGO_KEYCLOAK_URL: ${ARGO_KEYCLOAK_URL:-http://keycloak:8080}
      ARGO_KEYCLOAK_BACKEND_CLIENT_SECRET: ${ARGO_BACKEND_CLIENT_SECRET:-}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
