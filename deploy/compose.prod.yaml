# Produzione (Fase 7). Di norma: deploy/deploy.sh <sha> (immagini da GHCR, nessuna build).
# Senza CI: docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Nessuna porta pubblica: si entra dal proxy principale (deploy/proxy, da avviare prima),
# sulla rete `proxy`. Database e Keycloak su reti interne.
name: argo-prod

x-backend-env: &backend-env
  ARGO_ENVIRONMENT: production
  # Ruolo applicativo senza privilegi sullo schema (deploy/postgres/prod-init.sh).
  ARGO_DATABASE_URL: postgresql+asyncpg://argo_app:${ARGO_APP_DB_PASSWORD:?}@postgres:5432/iam_db
  ARGO_PUBLIC_URL: https://${ARGO_DOMAIN}
  # Rete interna per Admin API e token; URL pubblico per il browser e l'issuer dei token.
  ARGO_KEYCLOAK_URL: http://keycloak:8080
  ARGO_KEYCLOAK_PUBLIC_URL: https://${ARGO_AUTH_DOMAIN}
  ARGO_KEYCLOAK_BACKEND_CLIENT_SECRET: ${ARGO_BACKEND_CLIENT_SECRET:?}
  ARGO_OIDC_CLIENT_SECRET: ${ARGO_DASHBOARD_CLIENT_SECRET:?}
  ARGO_SECRETS_KEY: ${ARGO_SECRETS_KEY:-}
  ARGO_MASS_DEACTIVATION_THRESHOLD: ${ARGO_MASS_DEACTIVATION_THRESHOLD:-3}
  ARGO_SEND_INVITES: ${ARGO_SEND_INVITES:-true}

services:
  caddy:
    image: ghcr.io/mattiamare9/argo-caddy:${ARGO_IMAGE_TAG:-main}
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    environment:
      ARGO_DOMAIN: ${ARGO_DOMAIN:?imposta ARGO_DOMAIN}
      ARGO_AUTH_DOMAIN: ${ARGO_AUTH_DOMAIN:?imposta ARGO_AUTH_DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
      proxy:
        aliases: [argo]  # nome usato dal proxy principale
    depends_on: [api, keycloak]
    restart: unless-stopped

  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: iam_db
      ARGO_APP_DB_PASSWORD: ${ARGO_APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/prod-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Applica le migrazioni e termina; api e worker partono solo dopo.
  migrate:
    image: ghcr.io/mattiamare9/argo-backend:${ARGO_IMAGE_TAG:-main}
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      # Solo le migrazioni usano il proprietario dello schema.
      ARGO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/iam_db
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/mattiamare9/argo-backend:${ARGO_IMAGE_TAG:-main}
    build: ../backend
    environment: *backend-env
    networks: [edge, backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ghcr.io/mattiamare9/argo-backend:${ARGO_IMAGE_TAG:-main}
    build: ../backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    networks: [edge, backend]  # edge: raggiunge i SaaS (SCIM) su Internet
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [idp]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    # Keycloak tiene i temi in memoria: quando cambiano (hash da deploy.sh) l'etichetta
    # cambia e `up -d` ricrea il container, così il nuovo tema si vede senza comandi a mano.
    labels:
      argo.theme: ${ARGO_KC_THEME:-}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://${ARGO_AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"  # TLS terminato dal proxy principale
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -Xms256m -Xmx768m"
      ARGO_BACKEND_CLIENT_SECRET: ${ARGO_BACKEND_CLIENT_SECRET:?}
      ARGO_DASHBOARD_CLIENT_SECRET: ${ARGO_DASHBOARD_CLIENT_SECRET:?}
      ARGO_PUBLIC_URL: https://${ARGO_DOMAIN}
      ARGO_SMTP_HOST: ${ARGO_SMTP_HOST:?}
      ARGO_SMTP_PORT: ${ARGO_SMTP_PORT:-587}
      ARGO_SMTP_FROM: ${ARGO_SMTP_FROM:?}
      ARGO_SMTP_AUTH: ${ARGO_SMTP_AUTH:-true}
      ARGO_SMTP_USER: ${ARGO_SMTP_USER:-}
      ARGO_SMTP_PASSWORD: ${ARGO_SMTP_PASSWORD:-}
      ARGO_SMTP_STARTTLS: ${ARGO_SMTP_STARTTLS:-true}
      ARGO_SMTP_AUTH_TYPE: ${ARGO_SMTP_AUTH_TYPE:-basic}
      ARGO_SMTP_TOKEN_URL: ${ARGO_SMTP_TOKEN_URL:-}
      ARGO_SMTP_TOKEN_SCOPE: ${ARGO_SMTP_TOKEN_SCOPE:-}
      ARGO_SMTP_TOKEN_CLIENT_ID: ${ARGO_SMTP_TOKEN_CLIENT_ID:-}
      ARGO_SMTP_TOKEN_CLIENT_SECRET: ${ARGO_SMTP_TOKEN_CLIENT_SECRET:-}
    volumes:
      - ./keycloak/argo-realm.json:/opt/keycloak/data/import/argo-realm.json:ro
      - ./keycloak/themes/argo:/opt/keycloak/themes/argo:ro
    networks: [edge, backend, idp]
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 40
    restart: unless-stopped

networks:
  edge:
  proxy:
    external: true
    name: proxy
  backend:
    internal: true
  idp:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  keycloak-db-data:
