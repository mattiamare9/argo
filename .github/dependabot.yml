# Aggiornamenti settimanali raggruppati: una PR per ecosistema, la CI li verifica.
version: 2
updates:
  - package-ecosystem: uv
    directories: [/backend, /sync-agent]
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule: { interval: weekly, day: monday }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/backend, /deploy/caddy]
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly, day: monday }
